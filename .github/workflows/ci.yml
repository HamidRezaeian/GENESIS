name: GENESIS CI

on:
  push:
  pull_request:

# Minimal, honest CI (deep review P0-2). The project keeps its tests as executable
# scripts (not pytest modules), matching tests/*_test.py conventions; each prints a
# PASS line and exits non-zero on failure. Slow kernel-driving probes are excluded.

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "numba>=0.59" websockets psutil pytest
          pip install -e .

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Fast suite (pytest wrapper over the script tests)
        run: python -m pytest -m "not slow" -q
        env:
          GENESIS_LIVE_WEB: "0"

      - name: Engine smoke (200 ticks; kernel JIT, cold-cache tolerant)
        run: python -m pytest -m slow -q
        env:
          GENESIS_LIVE_WEB: "0"
          NUMBA_CACHE_DIR: /tmp/genesis_ci_numba
        timeout-minutes: 20
