<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GENESIS Neuron Visualizer - REAL DATA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
        }

            #info-panel h1 {
                font-size: 18px;
                color: #4fc3f7;
                margin-bottom: 10px;
            }

            #info-panel .stat {
                font-size: 12px;
                margin: 5px 0;
                color: #aaa;
            }

            #info-panel .value {
                color: #4fc3f7;
                font-weight: bold;
            }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
        }

            #controls button {
                background: #4fc3f7;
                color: #000;
                border: none;
                padding: 8px 16px;
                margin: 5px;
                border-radius: 4px;
                cursor: pointer;
            }

                #controls button:hover {
                    background: #29b6f6;
                }

        #trace-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            width: 400px;
        }

        #trace-canvas {
            width: 100%;
            height: 150px;
            background: #0a0a1a;
            border-radius: 4px;
        }

        .legend {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }

        .legend-color {
            width: 20px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">Loading GENESIS Visualizer...</div>

    <div id="info-panel">
        <h1>GENESIS Neuron Visualizer</h1>
        <div class="stat">Compartments: <span class="value" id="n-comps">-</span></div>
        <div class="stat">Active: <span class="value" id="n-active">-</span></div>
        <div class="stat">Time: <span class="value" id="time-ms">0 ms</span></div>
        <div class="stat">Soma V: <span class="value" id="soma-v">-70 mV</span></div>
    </div>

    <div id="controls">
        <button onclick="play()">Play</button>
        <button onclick="pause()">Pause</button>
        <button onclick="reset()">Reset</button>
        <button onclick="toggleColors()">Voltage Colors</button>
    </div>

    <div id="trace-panel">
        <h3 style="margin-bottom:10px;color:#4fc3f7;">Soma Voltage (REAL DATA)</h3>
        <canvas id="trace-canvas"></canvas>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#E74C3C"></div>Soma</div>
        <div class="legend-item"><div class="legend-color" style="background:#F39C12"></div>AIS</div>
        <div class="legend-item"><div class="legend-color" style="background:#3498DB"></div>Apical Trunk</div>
        <div class="legend-item"><div class="legend-color" style="background:#5DADE2"></div>Apical Oblique</div>
        <div class="legend-item"><div class="legend-color" style="background:#85C1E9"></div>Apical Tuft</div>
        <div class="legend-item"><div class="legend-color" style="background:#27AE60"></div>Basal</div>
        <div class="legend-item"><div class="legend-color" style="background:#F5E6CC"></div>Myelin</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let morphology = null;
        let traces = null;
        let meshes = [];
        let currentFrame = 0;
        let isPlaying = false;
        let useVoltageColors = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(200, 200, 300);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 200, 100);
            scene.add(directionalLight);

            addControls();
            loadData();
            animate();
        }

        function addControls() {
            let isDragging = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - prevMouse.x;
                    const dy = e.clientY - prevMouse.y;
                    camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), dx * 0.005);
                    camera.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), dy * 0.005);
                    prevMouse = { x: e.clientX, y: e.clientY };
                }
            });

            renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });

            renderer.domElement.addEventListener('wheel', (e) => {
                const scale = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
            });
        }

        async function loadData() {
            try {
                const morphResponse = await fetch('/api/morphology');
                morphology = await morphResponse.json();

                const traceResponse = await fetch('/api/traces');
                traces = await traceResponse.json();

                document.getElementById('loading').style.display = 'none';

                document.getElementById('n-comps').textContent = morphology.n_compartments;
                document.getElementById('n-active').textContent =
                    morphology.compartments.filter(c => c.has_channels).length;

                buildNeuron();
                drawTrace();
            } catch (error) {
                document.getElementById('loading').textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }

        function buildNeuron() {
            const comps = morphology.compartments;

            comps.forEach(comp => {
                const { position, geometry, color } = comp;
                const radius = Math.max(0.5, geometry.diameter_um / 2);
                const length = Math.max(1, geometry.length_um);

                const geo = new THREE.CylinderGeometry(radius, radius, length, 8);
                const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color(color) });
                const mesh = new THREE.Mesh(geo, mat);

                mesh.position.set(position.x, position.y, position.z);
                mesh.userData = { idx: comp.idx, type: comp.type, color: color, has_channels: comp.has_channels };

                scene.add(mesh);
                meshes.push(mesh);
            });

            drawConnections(comps);
        }

        function drawConnections(comps) {
            const lineMat = new THREE.LineBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.3 });

            comps.forEach(comp => {
                if (comp.parent >= 0 && comp.parent < comps.length) {
                    const parent = comps[comp.parent];
                    const points = [
                        new THREE.Vector3(comp.position.x, comp.position.y, comp.position.z),
                        new THREE.Vector3(parent.position.x, parent.position.y, parent.position.z)
                    ];
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geo, lineMat);
                    scene.add(line);
                }
            });
        }

        function updateVoltageColors(V_mV) {
            meshes.forEach((mesh, idx) => {
                if (V_mV && V_mV[idx] !== undefined) {
                    const v = V_mV[idx];
                    mesh.material.color.set(voltageToColor(v));
                    mesh.material.emissive.set(voltageToColor(v));
                    mesh.material.emissiveIntensity = 0.3;
                }
            });
        }

        function voltageToColor(v_mV) {
            const t = Math.max(0, Math.min(1, (v_mV + 90) / 140));
            const r = Math.floor(255 * t);
            const b = Math.floor(255 * (1 - t));
            return `#${r.toString(16).padStart(2, '0')}00${b.toString(16).padStart(2, '0')}`;
        }

        function drawTrace() {
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (traces && traces.traces && traces.traces['0']) {
                const trace = traces.traces['0'].V_mV;

                ctx.strokeStyle = '#4fc3f7';
                ctx.lineWidth = 1.5;
                ctx.beginPath();

                const vMin = -90, vMax = 50;

                for (let i = 0; i < trace.length; i++) {
                    const x = (i / trace.length) * canvas.width;
                    const y = canvas.height - ((trace[i] - vMin) / (vMax - vMin)) * canvas.height;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.strokeStyle = '#333';
                ctx.lineWidth = 0.5;
                for (let v = -80; v <= 40; v += 20) {
                    const y = canvas.height - ((v - vMin) / (vMax - vMin)) * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
        }

        function play() { isPlaying = true; }
        function pause() { isPlaying = false; }
        function reset() {
            isPlaying = false;
            currentFrame = 0;
            meshes.forEach(mesh => {
                mesh.material.color.set(mesh.userData.color);
                mesh.material.emissiveIntensity = 0;
            });
        }
        function toggleColors() {
            useVoltageColors = !useVoltageColors;
            if (!useVoltageColors) reset();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && traces && traces.traces['0']) {
                const trace = traces.traces['0'].V_mV;
                const t = traces.t_ms[currentFrame] || 0;

                document.getElementById('time-ms').textContent = `${t.toFixed(1)} ms`;

                if (useVoltageColors) {
                    // Create voltage array for all compartments (soma = trace value)
                    const V_mV = new Array(morphology.n_compartments).fill(-70);
                    V_mV[0] = trace[currentFrame]; // Soma
                    updateVoltageColors(V_mV);
                }

                document.getElementById('soma-v').textContent = `${trace[currentFrame].toFixed(1)} mV`;

                currentFrame = (currentFrame + 1) % traces.n_samples;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('load', () => {
            init();
        });
    </script>
</body>
</html>
