[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "4.0.0"
description = "GENESIS: Deep Cortical Evolution & Neuromorphic Substrate Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "numba>=0.56.0",
    "websockets>=10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
cuda = [
    "torch>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "*_probe.py"]
addopts = "-v --tb=short"
