[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ============================================================
# GENESIS — combined project configuration
# Phase 0a additions are in [project.optional-dependencies.biophysical]
# ============================================================

[project]
name = "genesis"
version = "4.1.0-0a"
description = "GENESIS: Deep Cortical Evolution & Neuromorphic Substrate Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.56.0",
    "websockets>=10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
]
cuda = [
    "torch>=2.0.0",
]
biophysical = [
    # Phase 0a — passive cable model
    "numpy>=1.24",
    "scipy>=1.11",        # sparse matrices + SuperLU
    # Phase 0b+ (planned)
    # "h5py>=3.9",        # SWC loader, HDF5 output
    # Phase 0e — CRITICAL: DNA → RNA → Protein
    # "pandas>=2.0",      # RNA-seq expression tables
    # "biopython>=1.81",  # DNA/NCBI genome parsing
    # "sympy>=1.12",      # symbolic gene-network ODEs
]
plot = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
# Two independent test suites:
#   tests/          — original GENESIS script tests
#   src/biophysical/tests/ — Phase 0a unit + integration tests
# Run Phase 0a tests with: pytest src/biophysical/tests/
testpaths = ["tests", "src/biophysical/tests"]
python_files = ["test_*.py"]
norecursedirs = ["legacy", "clusy"]
addopts = "-v --tb=short"
markers = [
    "slow: kernel-driving probes (numba JIT compile; seconds-to-minutes each)",
    "biophysical: Phase 0a+ passive cable and biophysical simulation tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["biophysical"]
omit   = ["src/biophysical/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 60
